spring.application.name=couple-backend
server.port=${SERVER_PORT:8081}
app.public-base-url=${APP_PUBLIC_BASE_URL:https://couple.vikeatl.xyz}
app.cache.ttl=${APP_CACHE_TTL:PT5M}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/couple_service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1

# SQL
# Production deploy uses manually executed schema/data SQL. Do not rerun scripts on every app startup.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# WeChat Mini Program
wechat.mini-program.app-id=${WECHAT_MINI_PROGRAM_APP_ID:wx9bf8299403b8cf2b}
wechat.mini-program.app-secret=${WECHAT_MINI_PROGRAM_APP_SECRET:}
